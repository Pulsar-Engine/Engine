name: ci
run-name: CI - Engine
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10"]
        cmake-version: ["3.26.0"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ matrix.cmake-version }}
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install conan
        run: pip install conan
      - name: Build project
        run: python3 build.py Release
      - name: Install .NET SDK on Windows
        if: runner.os == 'Windows'
        run: |
          choco install dotnet-sdk --version 6.0.100
      - name: Download Dependency Walker
        if: runner.os == 'Windows'
        run: |
          curl -L -o release.zip https://github.com/Ex-Origin/ldd-win/releases/download/2.0/release.zip
          unzip release.zip -d ldd
          mv ldd/ldd.exe ./ldd.exe
      - name: Install libs
        if: runner.os == 'Windows'
        run: dotnet add package ClrPhlib --version 1.10.7968.33601
      - name: Check missing DLLs
        if: runner.os == 'Windows'
        run: ./ldd.exe "D:\a\Engine\Engine\build\pulsar-engine-test.exe"
      - name: Test project
        run: ctest -C Release
